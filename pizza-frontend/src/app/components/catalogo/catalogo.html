<div class="container">
  <h2 class="titulo-pagina">🍕 Cardápio da Pizzaria</h2>

  <div *ngIf="itens.length === 0">A carregar os itens do menu...</div>

  <div class="grid-cardapio">
    <div *ngFor="let item of itens" class="card-pizza">
      <div>
        <h3>{{ item.nome }}</h3>
        <p class="descricao">{{ item.descricaoItem }}</p>
      </div>
      <div>
        <p class="preco">R$ {{ item.preco }}</p>
        <button (click)="adicionarAoCarrinho(item)" class="btn-adicionar">
          Adicionar ao Pedido
        </button>
      </div>
    </div>
  </div>
</div>
